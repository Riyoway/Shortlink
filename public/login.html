<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Shortlink</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
  <style>
    :root {
      color-scheme: dark;
      --background: #09090b;
      --card: #111114;
      --primary: #f4f4f5;
      --primary-foreground: #09090b;
      --muted-foreground: #a1a1aa;
      --secondary: #27272a;
      --accent: #2dd4bf;
      --destructive: #f87171;
      --border: #27272a;
      --input: #27272a;
      --ring: #2dd4bf;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgb(45 212 191 / 0.18), transparent 28rem),
        linear-gradient(180deg, #0d0d12 0%, var(--background) 52%);
      color: var(--primary);
    }

    main {
      width: min(420px, 100%);
      animation: enter 360ms ease both;
    }

    .brand {
      display: grid;
      place-items: center;
      gap: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--accent);
      box-shadow: 0 18px 60px rgb(0 0 0 / 0.45);
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 6px 0 0;
      color: var(--muted-foreground);
    }

    form {
      display: grid;
      gap: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 18px;
      background: rgb(17 17 20 / 0.86);
      box-shadow: 0 18px 60px rgb(0 0 0 / 0.45);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted-foreground);
      font-size: 0.86rem;
      font-weight: 650;
    }

    input,
    button {
      min-height: 44px;
      border-radius: 8px;
      font: inherit;
    }

    input {
      width: 100%;
      border: 1px solid var(--input);
      padding: 0 12px;
      background: var(--background);
      color: var(--primary);
    }

    input:focus,
    button:focus-visible {
      border-color: var(--ring);
      outline: 0;
      box-shadow: 0 0 0 3px rgb(45 212 191 / 0.18);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      background: var(--primary);
      color: var(--primary-foreground);
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .status {
      min-height: 22px;
      color: var(--destructive);
      font-size: 0.9rem;
    }

    [data-lucide] {
      width: 16px;
      height: 16px;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="brand">
      <div class="mark"><i data-lucide="link-2"></i></div>
      <div>
        <h1>Shortlink Login</h1>
        <p>Sign in to manage your short URLs.</p>
      </div>
    </section>

    <form id="login-form">
      <label>
        Username
        <input name="username" autocomplete="username" value="admin" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" id="submit-button"><i data-lucide="log-in"></i>Login</button>
      <div class="status" id="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const button = document.querySelector("#submit-button");
    const status = document.querySelector("#status");

    document.addEventListener("DOMContentLoaded", () => {
      window.lucide?.createIcons();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "";
      button.disabled = true;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({ error: "Login failed." }));
          throw new Error(data.error || "Login failed.");
        }

        location.href = "/admin";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
