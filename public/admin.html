<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortlink Admin</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5ef;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #6d6f75;
      --line: #d9d4ca;
      --soft: #ece7dc;
      --accent: #0b6f6a;
      --accent-ink: #ffffff;
      --danger: #b42318;
      --focus: #c27c2c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --panel: #1b1f28;
        --ink: #f5f7fa;
        --muted: #adb4c0;
        --line: #343a46;
        --soft: #252b36;
        --accent: #51c3b8;
        --accent-ink: #071817;
        --danger: #ff8a80;
        --focus: #f0b36b;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.3rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .domain {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      white-space: nowrap;
    }

    .toolbar,
    form,
    table,
    .empty {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .search {
      flex: 1;
      max-width: 420px;
    }

    form {
      display: grid;
      grid-template-columns: minmax(160px, 220px) minmax(180px, 240px) minmax(260px, 1fr) auto auto;
      gap: 12px;
      align-items: end;
      padding: 16px;
      margin-bottom: 16px;
    }

    label,
    fieldset {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      border: 0;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }

    input:focus,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .segments {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 42px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
    }

    .segments label {
      display: grid;
      place-items: center;
      min-width: 0;
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
    }

    .segments input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .segments label:has(input:checked) {
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: var(--accent);
      color: var(--accent-ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    button[data-secondary],
    button[data-danger] {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    button[data-danger] {
      color: var(--danger);
    }

    button:disabled,
    input:disabled {
      cursor: not-allowed;
      opacity: 0.56;
    }

    .status {
      min-height: 22px;
      margin-bottom: 12px;
      color: var(--muted);
    }

    .status[data-error="true"] {
      color: var(--danger);
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
    }

    .slug {
      font-weight: 750;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      white-space: nowrap;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 900px) {
      form {
        grid-template-columns: 1fr 1fr;
      }

      form label:nth-of-type(2) {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 720px) {
      header,
      .toolbar {
        display: block;
      }

      .domain {
        display: inline-block;
        margin-top: 12px;
      }

      .search {
        max-width: none;
      }

      form {
        grid-template-columns: 1fr;
      }

      form label:nth-of-type(2) {
        grid-column: auto;
      }

      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        border-bottom: 1px solid var(--line);
      }

      tr:last-child {
        border-bottom: 0;
      }

      td {
        border-bottom: 0;
      }

      .actions {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Shortlink</h1>
        <p>Create, customize, copy, edit, and remove short URLs for your domain.</p>
      </div>
      <div class="domain" id="domain">link.riyo.me</div>
    </header>

    <form id="link-form">
      <fieldset>
        Slug mode
        <div class="segments">
          <label><input type="radio" name="mode" value="auto" checked>Auto</label>
          <label><input type="radio" name="mode" value="custom">Custom</label>
        </div>
      </fieldset>

      <label>
        Custom slug
        <input name="slug" autocomplete="off" pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{1,63}" placeholder="asId93" disabled>
      </label>

      <label>
        Destination URL
        <input name="url" type="url" placeholder="https://github.com/yourname" required>
      </label>

      <button type="submit" id="save-button">Create</button>
      <button type="button" data-secondary id="reset-button">Clear</button>
    </form>

    <div class="status" id="status" aria-live="polite"></div>

    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Search short links or destinations">
      <p id="summary"></p>
    </div>

    <section id="links"></section>
  </main>

  <script>
    const form = document.querySelector("#link-form");
    const links = document.querySelector("#links");
    const status = document.querySelector("#status");
    const summary = document.querySelector("#summary");
    const search = document.querySelector("#search");
    const saveButton = document.querySelector("#save-button");
    const resetButton = document.querySelector("#reset-button");
    const slugInput = form.elements.slug;
    const modeInputs = Array.from(form.elements.mode);

    let allLinks = [];
    let editingSlug = "";

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.dataset.error = String(isError);
    }

    function currentMode() {
      return modeInputs.find((input) => input.checked)?.value || "auto";
    }

    function syncMode() {
      const custom = currentMode() === "custom";
      slugInput.disabled = !custom;
      slugInput.required = custom;
      if (!custom && !editingSlug) slugInput.value = "";
      saveButton.textContent = editingSlug ? "Update" : "Create";
    }

    async function request(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || "Request failed");
      }
      return response.json();
    }

    async function loadLinks() {
      const data = await request("/api/links");
      allLinks = data.links;
      renderLinks();
    }

    function renderLinks() {
      const query = search.value.trim().toLowerCase();
      const visible = allLinks.filter((link) => {
        return !query || link.slug.toLowerCase().includes(query) || link.url.toLowerCase().includes(query);
      });

      summary.textContent = allLinks.length === 1 ? "1 link" : allLinks.length + " links";

      if (visible.length === 0) {
        links.innerHTML = '<div class="empty">' + (allLinks.length === 0 ? "No links yet." : "No matching links.") + '</div>';
        return;
      }

      const rows = visible.map((link) => {
        const shortUrl = location.origin + "/" + encodeURIComponent(link.slug);
        return '<tr>' +
          '<td class="slug"><a href="' + shortUrl + '" target="_blank" rel="noreferrer">' + escapeHtml(link.slug) + '</a></td>' +
          '<td><a href="' + escapeHtml(link.url) + '" target="_blank" rel="noreferrer">' + escapeHtml(link.url) + '</a></td>' +
          '<td>' + link.visits + '</td>' +
          '<td>' + new Date(link.updatedAt).toLocaleString() + '</td>' +
          '<td><div class="actions">' +
            '<button data-secondary data-copy="' + escapeHtml(link.slug) + '">Copy</button>' +
            '<button data-secondary data-edit="' + escapeHtml(link.slug) + '">Edit</button>' +
            '<button data-danger data-delete="' + escapeHtml(link.slug) + '">Delete</button>' +
          '</div></td>' +
        '</tr>';
      }).join("");

      links.innerHTML = '<table><thead><tr><th>Short</th><th>Destination</th><th>Visits</th><th>Updated</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");

      const data = Object.fromEntries(new FormData(form));
      if (currentMode() === "auto") delete data.slug;
      if (editingSlug) data.originalSlug = editingSlug;

      try {
        const result = await request("/api/links", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(data)
        });

        const shortUrl = location.origin + "/" + result.link.slug;
        await navigator.clipboard?.writeText(shortUrl).catch(() => undefined);
        resetForm();
        await loadLinks();
        setStatus("Saved and copied " + shortUrl);
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    resetButton.addEventListener("click", () => {
      resetForm();
      setStatus("");
    });

    modeInputs.forEach((input) => {
      input.addEventListener("change", syncMode);
    });

    search.addEventListener("input", renderLinks);

    links.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const slug = button.dataset.copy || button.dataset.edit || button.dataset.delete;
      const link = allLinks.find((item) => item.slug === slug);
      if (!link) return;

      if (button.dataset.copy) {
        const shortUrl = location.origin + "/" + link.slug;
        await navigator.clipboard?.writeText(shortUrl).catch(() => undefined);
        setStatus("Copied " + shortUrl);
        return;
      }

      if (button.dataset.edit) {
        editingSlug = link.slug;
        form.elements.mode.value = "custom";
        slugInput.value = link.slug;
        slugInput.disabled = false;
        slugInput.required = true;
        form.elements.url.value = link.url;
        saveButton.textContent = "Update";
        slugInput.focus();
        setStatus("Editing " + link.slug);
        return;
      }

      if (button.dataset.delete) {
        if (!confirm("Delete " + link.slug + "?")) return;
        try {
          await request("/api/links/" + encodeURIComponent(link.slug), { method: "DELETE" });
          if (editingSlug === link.slug) resetForm();
          await loadLinks();
          setStatus("Deleted " + link.slug);
        } catch (error) {
          setStatus(error.message, true);
        }
      }
    });

    function resetForm() {
      editingSlug = "";
      form.reset();
      syncMode();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    syncMode();
    loadLinks().catch((error) => {
      setStatus(error.message, true);
      links.innerHTML = '<div class="empty">Unable to load links.</div>';
    });
  </script>
</body>
</html>
